<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; background: #fff; color: #211915; }
  h1 { font-size: 15px; margin: 0 0 4px; color: #C78340; }
  p { font-size: 12px; color: #666; margin: 0 0 10px; }
  button { width: 100%; padding: 10px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
  #enviar { background: #16a34a; color: #fff; }
  #parar { background: #eee; color: #333; margin-top: 6px; }
  label { display: flex; gap: 6px; align-items: center; font-size: 12px; margin: 8px 0; color: #444; }
  #status { margin-top: 10px; padding: 10px; border-radius: 10px; background: #f3f4f6; font-size: 12px; line-height: 1.4; min-height: 40px; white-space: pre-wrap; }
  #barra { height: 6px; background: #e5e7eb; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  #barra div { height: 100%; width: 0; background: #C78340; transition: width .3s; }
</style>
</head>
<body>
  <h1>Brasa WhatsApp Sender</h1>
  <p>Abra a tela <b>Cotação → Fornecedores</b> do sistema, deixe o WhatsApp Web logado neste Chrome e clique em Enviar.</p>
  <button id="enviar">Enviar para os pendentes</button>
  <label><input type="checkbox" id="reenviar"> incluir os já marcados como enviados</label>
  <button id="parar">Parar</button>
  <div id="status">…</div>
  <div id="barra"><div id="progresso"></div></div>
  <script src="popup.js"></script>
</body>
</html>
