# Compila o app do entregador na nuvem (não precisa de Android Studio no PC).
# Roda quando algo em app-entregador/ muda, ou à mão em Actions → "Run workflow".
#
# Sai sempre o APK de teste, que é como o app é instalado hoje no celular dos
# entregadores (link fixo no release "app-entregador").
#
# E sai TAMBÉM o .aab assinado — o formato que a Play Store exige — desde que os
# segredos da chave de assinatura existam no repositório. Enquanto não
# existirem, essa parte é pulada em silêncio e o APK continua saindo.
name: App do entregador (Android)

on:
  push:
    branches: [main]
    paths: ["app-entregador/**", "public/icons/entregas-512.png", ".github/workflows/app-entregador.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # O identificador do app é PRA SEMPRE depois de publicado na loja.
  APP_ID: br.com.vtmstore.entregas
  APP_NOME: Entregas
  APP_VERSION_NAME: "1.0.0"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-entregador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Dependências
        run: npm install --no-audit --no-fund

      - name: Projeto Android (sincroniza, aplica permissões/nome/ícone/versão)
        env:
          # A Play recusa uma versão repetida. O número da execução nunca volta.
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -x
          npx cap sync android
          node scripts/patch-android.mjs
          chmod +x android/gradlew

      - name: Compilar APK de teste
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BrasaEntregas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BrasaEntregas-apk
          path: app-entregador/BrasaEntregas.apk

      # ---------------------------------------------------------------------
      # O pacote da loja. Só acontece quando a chave de assinatura existe.
      # ---------------------------------------------------------------------
      - name: Tem chave de assinatura?
        id: chave
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          else
            echo "tem=nao" >> "$GITHUB_OUTPUT"
            echo "Sem ANDROID_KEYSTORE_BASE64 nos segredos: pulando o pacote da loja."
          fi

      - name: Montar o .aab assinado
        if: steps.chave.outputs.tem == 'sim'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/chave.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/chave.jks"
          cd android && ./gradlew bundleRelease --no-daemon
          cd .. && cp android/app/build/outputs/bundle/release/app-release.aab Entregas.aab
          # A chave não fica na máquina depois do build.
          rm -f "$RUNNER_TEMP/chave.jks"

      # O .aab NÃO vai pro release público: é o pacote que sobe na Play Console,
      # e fica guardado como artefato da execução, pra baixar de dentro do Actions.
      - uses: actions/upload-artifact@v4
        if: steps.chave.outputs.tem == 'sim'
        with:
          name: Entregas-aab
          path: app-entregador/Entregas.aab
          retention-days: 30

      # Link fixo: https://github.com/<org>/<repo>/releases/download/app-entregador/BrasaEntregas.apk
      - name: Publicar no release "app-entregador"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-entregador
          name: App do entregador (Android)
          body: "APK mais recente do app do entregador. Baixe no celular e instale (permitir 'fontes desconhecidas')."
          files: app-entregador/BrasaEntregas.apk
